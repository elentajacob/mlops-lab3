name: CI

on:
  push:
    branches: [main]
    # Only run when code, tests, dependencies or CI config change
    paths:
      - 'src/**'
      - 'test/**'
      - 'requirements.txt'
      - '.github/**'
  pull_request:
    branches: [main]   # every PR into main is checked (no path filter, so the required check always reports)
  workflow_dispatch:   # manual "Run workflow" button

permissions:
  contents: read       # CI only reads the code

# A newer push to the same branch cancels the older, now-outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash        # same shell (and pipefail) on Linux and Windows runners

env:
  COVERAGE_MIN: 95     # coverage gate: fail if src/ coverage drops below this %

jobs:
  # ---------- Stage 1: static checks ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check --output-format=github .

  # ---------- Stage 2a: pytest on 3 Python versions x 2 operating systems ----------
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # finish every combination so all failures are visible
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage gate
        run: |
          mkdir -p reports
          python -m pytest test/test_pytest.py -v \
            --junitxml=reports/pytest-report.xml \
            --cov=src --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=$COVERAGE_MIN

      - name: Write job summary
        if: always()
        run: |
          python .github/scripts/junit_summary.py \
            "pytest — ${{ matrix.os }}, Python ${{ matrix.python-version }}" \
            reports/pytest-report.xml >> $GITHUB_STEP_SUMMARY || true
          echo "#### Coverage (minimum ${COVERAGE_MIN}%)" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/

  # ---------- Stage 2b: unittest on the same matrix ----------
  unittest:
    name: unittest (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittest
        run: |
          mkdir -p reports
          python -m unittest discover -s test -p "test_unittest.py" -t . -v 2>&1 | tee reports/unittest.log

      - name: Write job summary
        if: always()
        run: |
          echo "### unittest — ${{ matrix.os }}, Python ${{ matrix.python-version }} — ${{ job.status == 'success' && '✅ all passed' || '❌ failed' }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 4 reports/unittest.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload unittest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/

  # ---------- Stage 3: one required check that gates merging ----------
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, pytest, unittest]
    runs-on: ubuntu-latest
    steps:
      - name: Check every stage succeeded
        run: |
          {
            echo "## CI result"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| pytest (6 environments) | ${{ needs.pytest.result }} |"
            echo "| unittest (6 environments) | ${{ needs.unittest.result }} |"
          } >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.pytest.result }}" != "success" || \
                "${{ needs.unittest.result }}" != "success" ]]; then
            echo "❌ At least one CI stage failed — this commit must not be merged." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All stages passed — safe to merge." >> $GITHUB_STEP_SUMMARY
